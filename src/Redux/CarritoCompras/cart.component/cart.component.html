<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container" style="background-color: rgb(222, 226, 229);">

        <h5>Carrito de compras</h5>
        <div class="container" style=" display: flex; justify-content: flex-start;">
            <button class="btn btn-success" (click)="agregarPrueba('Laptop', 1200)">+ Añadir Laptop ($1200)</button>
            <button class="btn btn-success" (click)="agregarPrueba('Mouse', 25) " style="margin-left: 10px;">+ Añadir Mouse ($25)</button>
        </div>
        <h5>PRODUCTOS AGREGADOS: </h5>
        <ul>
            <li *ngFor="let item of (item$ | async)">
                {{ item.name }} {{item.quantity}} - {{ item.price | currency }}
                <button class="btn btn-danger" (click)="eliminar(item.id)" style="margin-left: 10px; color: black; padding: 5px; margin: 5px;">Quitar</button>
                <button class="btn btn-warning" (click)="editar(item.id, item.quantity ?? 1)" style=" margin-left: 10px; padding: 5px;">Editar</button>
            </li>
        </ul>

        <div class="container" style="display: flex;">

            @if (((count$ | async) ?? 0) > 0) {
            <button class="btn btn-secondary" (click)="limpiar()" style="margin-bottom: 10px; justify-content: end; align-items: end; align-self: flex-end; align-content: end;">Vaciar Carrito</button> }
        </div>


    </div>

    <div class="container " style="margin: 10px;">
        <p style="color: red;"><b>Productos en total: </b> {{count$ | async}}</p>
        <p><b>Precio total:</b> {{total$ | async | currency}}</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
