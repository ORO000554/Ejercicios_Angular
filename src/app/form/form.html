<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Se corrigieron los enlaces de Bootstrap que daban error de integridad -->
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <div class="container mt-4 d-flex flex-row">
        <div class="container col-md-6">
            <p class="h4">Formulario</p>

            <form [formGroup]="formulario" (ngSubmit)="guardarRegistro()">
                <label for="nombre">Nombre:</label>
                <input class="form-control" id="nombre" type="text" formControlName="nombre">

                <label for="telefono">Teléfono:</label>
                <input class="form-control" id="telefono" type="text" formControlName="telefono">

                <label for="correo">Correo:</label>
                <input class="form-control" id="correo" type="email" formControlName="correo">

                <label for="usuario">Usuario:</label>
                <input class="form-control" id="usuario" type="text" formControlName="usuario">

                <button type="submit" class="btn btn-primary mt-3" data-toggle="modal" data-target="#exampleModal">
        Registrar datos
      </button>
            </form>
        </div>

        <div class="container col-md-6">
            <p class="h4">Datos de la tabla</p>

            <table class="table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Usuario</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let registro of registros">
                        <td>{{ registro.nombre }}</td>
                        <td>{{ registro.telefono }}</td>
                        <td>{{ registro.correo }}</td>
                        <td>{{ registro.usuario }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <!-- Button trigger modal -->
    <!-- <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#exampleModal">
  Launch demo modal
</button> -->

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>



</body>

</html>
