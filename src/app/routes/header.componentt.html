<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container-fluid p-0 m-0 d-flex" style="min-height: 100vh;">
        <!-- SIDEBAR -->
        <div class="d-flex flex-column flex-shrink-0 p-3 bg-dark bg-gradient text-white border-end" style="width: 280px; min-height: 100vh;">
            <!-- Logo o imagen -->
            <a routerLink="/vista2-component" class="d-flex align-items-center mb-3 mb-md-0  text-decoration-none text-center justify-content-center w-100" style="font-weight: bold; background-color: rgb(0, 157, 230); color: white; padding: 0.75rem 2rem; border-radius: 4px;">
            OPEN ROAD Solutions
        </a>
            <hr>
            <!-- lista de navegacion vertical -->
            <ul class="nav nav-pills flex-column mb-auto w-100">
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(1)" type="button" class="btn btn-dark w-100 text-start" [class.active]="PaginaActiva === 1" routerLink="/vista2-component">
                    Ejercicios Angular
                </button>
                </li>
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(2)" type="button" class="btn btn-dark w-100 text-start" [class.active]="PaginaActiva === 2" routerLink="/vista1-component">
                    Ejercicios Redux
                </button>
                </li>
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(3)" type="button" class="btn btn-dark w-100 text-start" [class.active]="PaginaActiva === 3" routerLink="/vista3-component">
                    Auth Redux
                </button>
                </li>
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(4)" type="button" class="btn btn-dark w-100 text-start" [class.active]="PaginaActiva === 4" routerLink="/clima-redux-vista">
                    Clima Redux
                </button>
                </li>
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(5)" type="button" class="btn btn-dark  w-100 text-start" [class.active]="PaginaActiva === 5" routerLink="/viaje-redux-vista">
                    Viaje Redux
                </button>
                </li>
                <li class="nav-item mb-2">
                    <button (click)="paginaSeleccionada(6)" type="button" class="btn btn-dark  w-100 text-start" [class.active]="PaginaActiva === 6" routerLink="/vista-audio-redux">
                    Audio Redux
                </button>
                </li>
            </ul>
            <!-- FIN DE SIDEBAR -->
        </div>
        <!-- INICIO CONTENIDO DE LAS PANTALLAS -->
        <div class="flex-grow-1 p-4" style="background-color: #f8f9fa;">
            <!-- El router-outlet -->
            <router-outlet></router-outlet>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
